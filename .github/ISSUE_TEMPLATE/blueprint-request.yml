name: Request a blueprint
description: Ask for a blueprint of software your company needs. Upvote existing requests with a thumbs-up instead of opening duplicates.
title: "Blueprint: "
labels: ["blueprint request"]
body:
  - type: markdown
    attributes:
      value: Search the open requests first and add a thumbs-up to the ones you need. We build the most-wanted blueprints first.
  - type: textarea
    id: job
    attributes:
      label: The job it does
      description: What should this software do for your company, and who uses it?
    validations:
      required: true
  - type: input
    id: replaces
    attributes:
      label: What it would replace
      placeholder: A SaaS product, a spreadsheet, a manual process
  - type: textarea
    id: musts
    attributes:
      label: Rules it must follow
      description: Approvals, compliance, things that must never happen. Never paste customer data.
